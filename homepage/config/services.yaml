          type: uptimekuma
          url: http://100.105.29.96:3002
          slug: homeserver

    - Portainer:
        icon: portainer
        href: https://100.105.29.96:9443
        description: Docker management UI

    - WUD:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wud.svg
        href: http://100.105.29.96:3001
        description: Container update monitor
        widget:
          type: whatsupdocker
          url: http://wud:3000

    - RAM Cleanup:
        icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/memory.svg
        href: http://100.105.29.96:9999/clean-ram
        description: Kill bash, Hermes CLI, and orphaned SSH login sessions
        target: _blank
        widget:
          type: customapi
          url: http://100.105.29.96:9999/count
          mappings:
            - field: count
              label: "Killable processes"
              format: number
            - field: freed_mb
              label: "Freeable space"
              format: number
              suffix: "MB"

    - Netdata:
        icon: netdata
        href: http://100.105.29.96:19999/v3/
        description: Container monitoring
        widget:
          type: netdata
          url: http://100.105.29.96:19999
