services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$
    ports:
      - "100.105.29.96:53:53/tcp"
      - "100.105.29.96:53:53/udp"
      - "100.105.29.96:80:80/tcp"
    environment:
      TZ: "Europe/Stockholm"
      PIHOLE_DNS_: "172.24.1.3#5053"
      FTLCONF_REPLY_ADDR: "192.168.0.100"
      FTLCONF_dns_listeningMode: "ALL"
    env_file: .env
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      dns-net:
        ipv4_address: 172.24.1.2

  dnscrypt-proxy:
    image: klutchell/dnscrypt-proxy:2.1.18
    container_name: dnscrypt-proxy
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./dnscrypt-proxy:/config
    networks:
      dns-net:
        ipv4_address: 172.24.1.3

networks:
  dns-net:
    name: dns-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.1.0/24
